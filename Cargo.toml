[package]
name = "pulse"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3     # Optimize for binary size; use "3" for speed
lto = "fat"       # Enable Link-Time Optimization
codegen-units = 1 # Reduce parallel code generation for better optimization
debug = false     # Disable debug information

[[bin]]
name = "main"
path = "src/bin/main.rs"

[dependencies]
# basic
clap = { version = "4.6.6", features = ["derive"] }
thiserror = "2.0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.29.2", features = ["v4"] }

# logging
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

# tokio
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "fs", "signal"] }
tokio-util = { version = "0.7.20", features = ["rt"] }

# rpc
prost = "0.14.4"
prost-types = "0.14.4"
tonic = { version = "0.14.9", features = ["transport", "router"] }
tonic-prost = "0.14.9"

[build-dependencies]
tonic-prost-build = "0.14.9"
